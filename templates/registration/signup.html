{% extends "base.html" %}

{% block title %}Sign up · Vicinity{% endblock %}

{% block content %}
<div class="card auth-card">
  <h1>Create an account</h1>
  <p class="muted">Free. Just a username and a password.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
  </form>
  <p class="small muted">Already have one? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
