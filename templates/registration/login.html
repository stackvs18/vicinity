{% extends "base.html" %}

{% block title %}Log in · Vicinity{% endblock %}

{% block content %}
<div class="card auth-card">
  <h1>Log in</h1>
  <p class="muted">Save areas and compare them later.</p>
  <form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p class="small muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
</div>
{% endblock %}
